name: TSY Agent Sandbox Pilot
on:
  push:
    branches:
      - feature/v3.5-agent-evidence-state-machine
    paths:
      - 'agent-runtime/pilot-task.json'
      - 'agent-runtime/run-pilot.mjs'
      - '.github/workflows/agent-sandbox-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-agent-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute approved-scope sandbox test task
        run: node agent-runtime/run-pilot.mjs
      - name: Attach runner evidence (test only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsy-agent-sandbox-pilot-evidence
          path: agent-runtime/artifacts/pilot-evidence.json
          if-no-files-found: warn
          retention-days: 7
